<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chill — Masuk</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-layout">
        <aside class="auth-visual">
          <div class="auth-badge"><span class="brand-mark">C</span> Chill</div>
          <div class="auth-copy">
            <h2>Streaming film & series dengan suasana santai.</h2>
            <p>
              Tonton hiburan favoritmu kapan saja, di mana pun, dengan kualitas streaming yang
              lancar dan pilihan konten yang terus berkembang.
            </p>
          </div>
        </aside>

        <main class="auth-card">
          <div class="brand inline-brand"><span class="brand-mark">C</span> Chill</div>
          <h1>Masuk</h1>

          <form class="auth-form">
            <div class="field">
              <label for="username">Username</label>
              <input id="username" type="text" placeholder="Masukkan username Anda" />
            </div>

            <div class="field">
              <label for="password">Kata Sandi</label>
              <input id="password" type="password" placeholder="Masukkan kata sandi" />
            </div>

            <div class="auth-links">
              <a href="#">Lupa Password?</a>
              <a href="register.html">Daftar</a>
            </div>

            <div class="auth-actions">
              <button class="btn btn-primary" type="submit">Masuk</button>
              <button class="btn btn-google" type="button">
                <span class="google-mark">G</span>
                Masuk dengan Google
              </button>
            </div>
          </form>
        </main>
      </div>
    </div>
  </body>
</html>

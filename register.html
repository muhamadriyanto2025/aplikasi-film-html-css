<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chill — Daftar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-layout">
        <aside class="auth-visual">
          <div class="auth-badge"><span class="brand-mark">C</span> Chill</div>
          <div class="auth-copy">
            <h2>Mulai koleksi film dan serial favorit Anda.</h2>
            <p>
              Buat akun untuk menyimpan daftar tontonan, mengikuti tren, dan menikmati pengalaman
              nonton yang lebih personal di Chill.
            </p>
          </div>
        </aside>

        <main class="auth-card">
          <div class="brand inline-brand"><span class="brand-mark">C</span> Chill</div>
          <h1>Daftar</h1>

          <form class="auth-form">
            <div class="field">
              <label for="register-username">Username</label>
              <input id="register-username" type="text" placeholder="Buat username Anda" />
            </div>

            <div class="field">
              <label for="register-password">Kata Sandi</label>
              <input id="register-password" type="password" placeholder="Buat kata sandi" />
            </div>

            <div class="field">
              <label for="confirm-password">Konfirmasi Kata Sandi</label>
              <input id="confirm-password" type="password" placeholder="Ulangi kata sandi" />
            </div>

            <div class="switch-copy">
              <span>Sudah punya akun? </span><a href="login.html">Masuk</a>
            </div>

            <div class="auth-actions">
              <button class="btn btn-primary" type="submit">Daftar</button>
              <button class="btn btn-google" type="button">
                <span class="google-mark">G</span>
                Sign In SSO with Google
              </button>
            </div>
          </form>
        </main>
      </div>
    </div>
  </body>
</html>
